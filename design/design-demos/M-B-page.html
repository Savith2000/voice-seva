<!doctype html>
<!--
  M-B — "the turned page" · Voice Seva mobile design direction B
  One self-contained page. No build, no network, all inline.

  ASSUMPTIONS
  · Default polarity is Dawn (dark). The scene is a dim room before sunrise;
    a light page at 5 a.m. is a lamp pointed at the reciter. Lamp (light) is
    one tap away behind the Appearance control, and both polarities are full.
  · The reading unit is the printed verse group — the opening invocation
    stands alone, the verses are couplets, the closing salutation of verse 18
    is one long line. A unit is never split across pages; pagination is
    MEASURED against the real leaf height at load, on resize, and whenever
    script lead or text size reflows the type, so the folio count is honest
    on every phone and at every setting.
  · Both scripts are printed for every line, lead first — a large share of
    this audience reads the romanised line, and a page of a Rudram book
    prints both. It also keeps the leaf still: nothing on a page changes
    size while the voice moves through it, which is what makes a page a page.

  THE PAGE-TURN, IN THIS WORLD'S GRAMMAR
  · No 3D flip, no curl. In the built app the one authored moment is the
    impression: type resolving out of a 3 px blur as it meets paper. The
    page-turn is that same event happening again — the finished leaf
    releases quickly (240 ms, a small lateral drift), and the next leaf is
    IMPRESSED onto the same paper (520 ms, blur 3px→0, 14 px of settle in
    the direction of travel, cubic-bezier(.16,1,.3,1), nothing bounces).
    Direction is carried by the drift alone. Under prefers-reduced-motion
    the turn is a plain 160 ms cross-fade.
  · The page turns itself when the voice crosses the leaf's last line —
    and only then. Between turns the screen is perfectly still; the only
    motion is ink arriving word by word, and the well breathing.

  WHERE THE PLACE LIVES
  · A running head, as in a book: section on the left, folio on the right —
    "Page n of N" counted within the section, flanked by the ‹ › that turn
    leaves by hand. The hairline under the head carries a thin full-chroma
    saffron place-mark: the voice's position through the loaded work (here
    Anuvaka I; in the full app, all 24 sections). Saffron is spent only on
    marks of the living voice — this is one.

  TAPPING A LINE vs TURNING BY HAND
  · Tapping a line PLACES the voice there (the pin of the built app): a tap
    is a statement about where the reader is, and it outranks the audio.
    State words stay honest.
  · Turning by hand — swipe on the paper, the ‹ › in the head, or arrow
    keys — is leafing ahead or back, which a book invites. The voice keeps
    its own leaf. A quiet ribbon rises at the foot of the page — a bookmark,
    in apparatus blue with a saffron ribbon-end — naming the voice's page;
    tapping it returns you. Tapping any LINE while leafed away pins the
    voice there instead: the two gestures never fight. There is no silent
    auto-return; the reader is never yanked.
  · The demo carries Anuvaka I only (the shared JSON); all 24 sections are
    listed in the sheet, and tapping an unloaded one says so plainly.

  §9 — WHY A TURNED PAGE IS THE RIGHT WAY FOR A PHONE TO CARRY A VOICE
  THROUGH SCRIPTURE
  Sri Rudram lives in books, and a reciter's memory of it is spatial — this
  couplet at the head of a leaf, the long salutation on a page of its own.
  A scroll is the machine's shape: continuous, always in motion, asking the
  eye to re-find its place after every glide. A page is the tradition's
  shape, and it buys the one thing a chanter actually needs from a screen:
  stillness. For the whole of a leaf nothing moves — the voice's only
  visible work is ink filling lines downward, the trace of a recitation
  rather than the animation of one — and the single motion the screen ever
  makes lands at a boundary the reciter's breath already knows, where a
  page-turner at a music stand would reach across. The phone is not
  scrolling lyrics under a voice; it is holding the book open and turning
  the leaf when the breath crosses it. A music player could not wear that
  sentence.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Seva · M-B · The turned page</title>
<style>
/* ======================= the world's materials ========================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{overscroll-behavior:none;-webkit-text-size-adjust:100%}

.stage{
  --ease:cubic-bezier(.16,1,.3,1);
  --scale:1;
  --barh:118px;
  --book:"Iowan Old Style","Palatino","Palatino Linotype","Hoefler Text",Charter,Georgia,serif;
  --dev:"Noto Sans Devanagari","Noto Serif Devanagari","Kohinoor Devanagari","Devanagari MT",sans-serif;
  height:100dvh; display:flex; flex-direction:column;
  background:var(--page); color:var(--ink);
  font-family:var(--book); font-size:16px;
  overflow:hidden;
  transition:background .5s ease, color .5s ease;
  padding-bottom:var(--barh);
}
.stage[data-light="lamp"]{
  --page:#E8E1D3; --paper:#F1EBDE;
  --ink:#221B12; --ink2:#5C5245; --ink3:#6F6456;
  --blue:#0C5098; --rule:rgba(12,80,152,.32); --rule-soft:rgba(12,80,152,.17);
  --saffron:#9C4A05; --saffron-full:#EE7900; --saffron-pale:rgba(238,121,0,.22);
  --key-side:#A24E00; --key-face:#FFF7EC; --key-well:rgba(120,70,20,.18);
  --well-sheen:rgba(255,255,255,.55);
  --scrim:rgba(34,27,18,.32);
}
.stage[data-light="dawn"]{
  --page:#131110; --paper:#1C1917;
  --ink:#EDE6D8; --ink2:#A99C88; --ink3:#9C907D;
  --blue:#8FB3DC; --rule:rgba(143,179,220,.34); --rule-soft:rgba(143,179,220,.18);
  --saffron:#EE9A45; --saffron-full:#EE7900; --saffron-pale:rgba(238,154,69,.24);
  --key-side:#7E3D00; --key-face:#20180F; --key-well:rgba(0,0,0,.42);
  --well-sheen:rgba(255,255,255,.07);
  --scrim:rgba(0,0,0,.5);
}
.stage button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0;touch-action:manipulation}

/* ============================ running head ============================= */
.head{
  flex:none; display:flex; align-items:center; justify-content:space-between;
  gap:8px; padding:calc(8px + env(safe-area-inset-top,0px)) 14px 2px 20px;
  animation:settle 420ms var(--ease) 240ms backwards;
}
.headwhere{font-size:14px; font-style:italic; color:var(--ink2); min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.folio{display:flex; align-items:center; gap:0; flex:none}
.folionum{font-size:14px; font-style:italic; color:var(--ink2);
  font-variant-numeric:oldstyle-nums tabular-nums; min-width:76px;
  text-align:center; white-space:nowrap; flex:0 1 auto}
.pgbtn{
  min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center;
  color:var(--blue); font-size:22px; line-height:1; opacity:.75;
  transition:opacity 240ms var(--ease);
}
.pgbtn:hover{opacity:1}
.pgbtn[disabled]{opacity:.18; cursor:default}
.pgbtn:focus-visible{outline:2px solid var(--blue); outline-offset:-4px; border-radius:8px}

/* The rule under the head doubles as the place-in-the-work: a thin saffron
   mark, the voice's position through the loaded text. Full chroma is spent
   only on marks of the living voice — this is one. */
.headrule{flex:none; height:2px; margin:0 20px; background:var(--rule-soft); position:relative;
  animation:sheet 460ms var(--ease) backwards}
.headrule i{position:absolute; left:0; top:0; bottom:0; right:0; background:var(--saffron-full);
  transform:scaleX(var(--place,0)); transform-origin:0 50%;
  transition:transform 600ms var(--ease)}

/* =============================== the leaf ============================== */
.leafbox{flex:1; min-height:0; position:relative; background:var(--paper);
  margin:0 20px; transition:background .5s ease; touch-action:pan-y;
  animation:lay 460ms var(--ease) backwards}
.leaf{position:absolute; inset:0; padding:20px 12px 12px; overflow:hidden;
  display:none}
.leaf[data-on]{display:block}
@media (max-width:374px){
  .stage .leafbox{margin:0 12px}
  .headrule{margin:0 12px}
  .head{padding-left:12px; padding-right:8px}
  .folionum{min-width:0}
}

/* the turn: an impression landing, not a flip */
@keyframes leaf-in-f{from{opacity:0; transform:translateX(14px); filter:blur(3px)}
  to{opacity:1; transform:none; filter:blur(0)}}
@keyframes leaf-in-b{from{opacity:0; transform:translateX(-14px); filter:blur(3px)}
  to{opacity:1; transform:none; filter:blur(0)}}
@keyframes leaf-out-f{from{opacity:1; transform:none} to{opacity:0; transform:translateX(-10px)}}
@keyframes leaf-out-b{from{opacity:1; transform:none} to{opacity:0; transform:translateX(10px)}}
.leaf.in-f{animation:leaf-in-f 520ms var(--ease) both}
.leaf.in-b{animation:leaf-in-b 520ms var(--ease) both}
.leaf.out-f{animation:leaf-out-f 240ms var(--ease) both}
.leaf.out-b{animation:leaf-out-b 240ms var(--ease) both}

/* hidden measuring surface — same box, same type, no paint */
.measurer{position:absolute; inset:0; padding:20px 12px 12px; visibility:hidden;
  pointer-events:none; overflow:hidden}

/* ============================== the text =============================== */
.unit{margin-bottom:14px}
.unit:last-child{margin-bottom:0}
.ln{padding:5px 2px; cursor:pointer; border-radius:2px}
.lead{margin:0; color:var(--ink2); transition:color .45s ease}
[data-lead="dev"] .lead{font-family:var(--dev); font-size:calc(21px * var(--scale)); line-height:1.9}
[data-lead="ia"]  .lead{font-family:var(--book); font-size:calc(20px * var(--scale)); line-height:1.62}
.second{margin:2px 0 0; color:var(--ink2)}
[data-lead="dev"] .second{font-family:var(--book); font-style:italic; font-size:calc(16px * var(--scale)); line-height:1.55; opacity:.92}
[data-lead="ia"]  .second{font-family:var(--dev); font-size:calc(18px * var(--scale)); line-height:1.9; opacity:.92}

/* The voice inks lines down the page. Above the active line the leaf is
   already written in saffron; the active line is full ink filling with a
   wet edge; below is still waiting in the quieter ink. */
.ln.now .lead{color:var(--ink)}
.ln.now .second{color:var(--ink2)}
.ln.done .lead{color:var(--saffron)}
.ln.done .second{color:var(--saffron); opacity:.78}
.inked{color:var(--saffron)}
.nowword{
  background-image:linear-gradient(90deg,
    var(--saffron) 0 calc(var(--wp,0%) - 4px),
    var(--ink) calc(var(--wp,0%) + 9px) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
/* the rule under the line being chanted — a pure width, frame-driven */
.prog{display:none; margin-top:8px; height:2px; background:var(--rule-soft); position:relative}
.ln.now .prog{display:block}
.prog i{position:absolute; left:0; top:0; bottom:0; background:var(--saffron-full); width:0}

/* ========================= the bookmark ribbon ========================= */
.ribbon{
  position:fixed; left:0; right:0; bottom:var(--barh); z-index:5;
  display:flex; align-items:center; justify-content:center; gap:10px;
  min-height:46px; padding:6px 16px; width:100%;
  background:var(--paper); border-top:1px solid var(--rule);
  color:var(--blue); font-style:italic; font-size:15px; text-align:center;
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity 400ms var(--ease), transform 400ms var(--ease);
}
.ribbon[data-shown]{opacity:1; transform:none; pointer-events:auto}
.ribbonmark{flex:none; width:9px; height:20px; background:var(--saffron-full);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}

/* ============================ the bottom bar =========================== */
.scrim{position:fixed; inset:0; background:var(--scrim); z-index:8;
  opacity:0; pointer-events:none; transition:opacity 480ms var(--ease)}
.scrim[data-shown]{opacity:1; pointer-events:auto}

/* Collapsed is expressed against the sheet's own height, so when iOS
   Safari's toolbars breathe and dvh moves, the bar re-seats itself without
   a script having to notice. */
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  height:min(78dvh, 660px); display:flex; flex-direction:column;
  background:var(--paper); border-top:1px solid var(--rule);
  border-radius:14px 14px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);
  transform:translateY(calc(100% - var(--barh)));
  transition:background .5s ease;
  touch-action:none;
}
.sheet.open{transform:translateY(0)}
.sheet.settle{transition:transform 480ms var(--ease), background .5s ease}

.barrow{
  flex:none; padding:6px 18px calc(12px + env(safe-area-inset-bottom,0px));
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.grab{width:36px; height:5px; border-radius:3px; background:var(--rule);
  margin:0 auto 8px}
.barmain{display:flex; align-items:flex-start; gap:16px}

/* status words — every state in the DOM, stacked, so nothing ever reflows */
.says{display:grid}
.say{grid-area:1/1; opacity:0; transform:translateY(-5px);
  transition:opacity 400ms var(--ease), transform 400ms var(--ease); pointer-events:none}
.say[data-on]{opacity:1; transform:none; pointer-events:auto}
.say:not([data-on]){transition-duration:220ms}
.statustxt{flex:1; min-width:0; padding-top:6px}
.word{font-family:var(--book); font-size:19px; line-height:1.3}
.sub{font-size:13px; color:var(--ink2); margin-top:3px; line-height:1.5}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0}

/* ------------------------- the living well ----------------------------- */
.press{flex:none; width:76px; display:flex; flex-direction:column;
  align-items:center; gap:6px}
.stage .wellbtn{
  display:block; width:56px; height:56px; padding:0; border:0;
  border-radius:50%; cursor:pointer; background:var(--paper);
  box-shadow:0 2px 0 var(--key-well), 0 6px 14px var(--key-well),
    inset 0 1px 0 var(--well-sheen);
  transition:transform 90ms var(--ease), box-shadow 240ms var(--ease),
    background 520ms var(--ease);
}
.stage .wellbtn:hover:not(:disabled):not([data-live]){
  transform:translateY(-1px);
  box-shadow:0 3px 0 var(--key-well), 0 9px 18px var(--key-well),
    inset 0 1px 0 var(--well-sheen);
}
.stage .wellbtn:active:not(:disabled),
.stage .wellbtn[data-live],
.stage .wellbtn[data-busy]{
  transform:translateY(2px);
  box-shadow:0 0 0 var(--key-well), 0 1px 2px var(--key-well),
    inset 0 2px 5px var(--key-well);
}
.stage .wellbtn:disabled{cursor:default}
.stage .wellbtn:focus-visible{outline:2px solid var(--blue); outline-offset:3px}
.pressword{font-size:13px; font-style:italic; color:var(--ink2);
  text-align:center; white-space:nowrap; transition:color 300ms var(--ease)}
.pressword .says{justify-items:center}
.well{width:100%; height:100%; overflow:visible; display:block;
  transform-origin:50% 50%; transition:transform 420ms var(--ease)}
.rim{fill:none; stroke:var(--ink3); stroke-width:1.5;
  transition:stroke 520ms var(--ease), opacity 520ms var(--ease)}
.ink{--ink:0; fill:var(--saffron-full); transform-box:view-box;
  transform:translateY(calc((1 - var(--ink)) * 100%));
  transition:fill 520ms var(--ease), opacity 520ms var(--ease)}
.drop{fill:var(--saffron-full); opacity:0; transition:opacity 300ms var(--ease)}
.stage .wellbtn:hover:not(:disabled)[data-condition="idle"] .drop{opacity:.3}
.draw{fill:none; stroke:var(--blue); stroke-width:1.6; stroke-linecap:round;
  stroke-dasharray:144.5; stroke-dashoffset:144.5; opacity:0; transform-origin:50% 50%}
[data-condition="idle"] .ink{opacity:0}
[data-condition="idle"] .rim{stroke:var(--ink3)}
[data-condition="locating"] .rim{stroke:var(--blue); opacity:.35}
[data-condition="locating"] .ink{opacity:0}
[data-condition="locating"] .draw{opacity:1;
  animation:lap 1.5s cubic-bezier(.62,0,.38,1) infinite, turn 3s linear infinite}
[data-condition="following"] .rim{stroke:var(--saffron-full)}
[data-condition="following"] .ink{opacity:1}
[data-condition="following"] .well{animation:breathe 4.4s ease-in-out infinite}
[data-condition="holding"] .rim{stroke:var(--saffron-full); opacity:.75}
[data-condition="holding"] .ink{opacity:.34; fill:var(--saffron-full)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.97)}50%{transform:scale(1)}}
@keyframes lap{0%{stroke-dashoffset:144.5}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-144.5}}

/* ============================ the open sheet =========================== */
.sheetbody{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:4px 22px calc(18px + env(safe-area-inset-bottom,0px));
  touch-action:pan-y}
.shr{height:1px; background:var(--rule-soft); margin:16px 0}
.k{font-size:13px; font-style:italic; color:var(--ink2); margin-bottom:4px}
.navrow{display:flex; align-items:baseline; flex-wrap:wrap; font-size:15px}
.navlbl{font-style:italic; color:var(--ink2); margin-right:10px; min-width:78px; font-size:14px}
.navrow button{color:var(--blue); opacity:.55; padding:11px 8px; min-width:34px;
  text-align:center; border-radius:4px}
.navrow button:hover{opacity:.9}
.navrow button.here{color:var(--ink); opacity:1; font-weight:600;
  box-shadow:inset 0 -2px 0 var(--saffron-full)}
.navnote{font-size:13px; font-style:italic; color:var(--ink3); min-height:20px;
  opacity:0; transition:opacity 300ms var(--ease)}
.navnote[data-shown]{opacity:1}

.gloss .ref{font-size:15px; color:var(--ink2); margin-bottom:6px}
.gloss .en{font-size:17px; line-height:1.62}
.gloss .none{font-size:14px; line-height:1.6; color:var(--ink2); font-style:italic}

.ctrls{display:grid; grid-template-columns:1fr 1fr; gap:16px 20px}
.ctrl{font-size:13px; line-height:1.5}
.choices{display:flex; gap:4px; align-items:baseline; flex-wrap:wrap; position:relative}
.choices button{font-size:15px; color:var(--ink2); padding:10px 6px}
.choices button:hover{color:var(--ink)}
.choices button[data-on]{color:var(--ink)}
.choices button.devword{font-family:var(--dev)}
.choices::after{
  content:""; position:absolute; left:0; top:0; width:1px; height:1.5px;
  background:var(--saffron-full); opacity:var(--o,0);
  transform:translate(var(--x,0), var(--y,0)) scaleX(var(--w,0));
  transform-origin:0 0; transition:transform 420ms var(--ease); pointer-events:none}
.choices[data-jump]::after{transition:none}
.micsel{font:inherit; font-size:15px; color:var(--ink2); background:none; border:0;
  border-bottom:1px solid var(--rule); max-width:170px; padding:10px 0}

.model{font-size:13px; line-height:1.65; color:var(--ink2); font-style:italic; text-align:center}
.crest{display:flex; justify-content:center; margin-top:18px}
.crest img{width:84px; height:84px; display:block}

/* ============================ page being set =========================== */
@keyframes sheet{from{opacity:0; transform:scaleX(.86)} to{opacity:1; transform:scaleX(1)}}
@keyframes lay{from{background:var(--page)} to{background:var(--paper)}}
@keyframes settle{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}

@media (prefers-reduced-motion: reduce){
  .head,.headrule,.leafbox{animation:none}
  .well,.draw{animation:none !important}
  .leaf.in-f,.leaf.in-b{animation:leaf-in-b 160ms linear both; transform:none; filter:none}
  .leaf.out-f,.leaf.out-b{animation:leaf-out-b 120ms linear both; transform:none}
  .say{transition:opacity 200ms linear}
  .choices::after{transition:opacity 200ms linear}
  .stage .wellbtn{transition:transform 90ms linear, box-shadow 90ms linear}
  .draw{opacity:1; stroke-dashoffset:37}
  .headrule i{transition:none}
  .sheet.settle{transition:transform 200ms linear}
}
</style>
</head>
<body>
<div class="stage" id="stage" data-light="dawn" data-lead="dev">

  <header class="head">
    <div class="headwhere" id="headwhere">Namakam · Anuvaka I</div>
    <div class="folio">
      <button type="button" class="pgbtn" id="pgPrev" aria-label="Previous page">&lsaquo;</button>
      <span class="folionum" id="folio">&nbsp;</span>
      <button type="button" class="pgbtn" id="pgNext" aria-label="Next page">&rsaquo;</button>
    </div>
  </header>
  <div class="headrule" id="headrule"><i></i></div>

  <main class="leafbox" id="leafbox" aria-label="Page of the chant">
    <div class="leaf" id="leafA" data-on></div>
    <div class="leaf" id="leafB"></div>
    <div class="measurer" id="measurer" aria-hidden="true"></div>
  </main>

  <button type="button" class="ribbon" id="ribbon">
    <i class="ribbonmark" aria-hidden="true"></i>
    <span id="ribbontext"></span>
  </button>

  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="sheetEl" aria-label="Controls">
    <div class="barrow" id="barrow">
      <div class="grab" aria-hidden="true"></div>
      <div class="barmain">
        <div class="press">
          <button type="button" class="wellbtn" id="wellbtn"
                  data-condition="idle" aria-pressed="false" aria-label="Begin listening">
            <svg viewBox="0 0 56 56" class="well" aria-hidden="true">
              <defs><clipPath id="bowl"><circle cx="28" cy="28" r="23"/></clipPath></defs>
              <g clip-path="url(#bowl)">
                <rect class="ink" id="wellink" x="0" y="0" width="56" height="56"/>
                <circle class="drop" cx="28" cy="28" r="9"/>
              </g>
              <circle class="rim" cx="28" cy="28" r="23"/>
              <circle class="draw" cx="28" cy="28" r="23"/>
            </svg>
          </button>
          <span class="pressword"><span class="says">
            <span class="say" id="pwBegin" data-on>Press to begin</span>
            <span class="say" id="pwPause">Press to pause</span>
          </span></span>
        </div>
        <div class="statustxt">
          <div class="says" id="statesays" aria-hidden="true"></div>
          <p class="sr" role="status" id="statesr"></p>
        </div>
      </div>
    </div>

    <div class="sheetbody" id="sheetbody">
      <div class="k">Sections</div>
      <div id="navrows"></div>
      <div class="navnote" id="navnote">This demo carries Namakam Anuvaka I; the app carries all 24.</div>

      <div class="shr"></div>

      <div class="gloss">
        <div class="ref" id="glossref"></div>
        <div id="glossbody"></div>
      </div>

      <div class="shr"></div>

      <div class="ctrls">
        <div class="ctrl"><div class="k">Script leads</div>

const LINES = [
{sequence:1,verse:1,devanagari:"ॐ नमो भगवते॑ रुद्रा॒य",transliteration:"oṃ namo bhagavate rudrāya"},
{sequence:2,verse:2,devanagari:"ॐ नम॑स्ते रुद्र म॒न्यव॑ उ॒तोत॒ इष॑वे॒ नमः॑",transliteration:"oṃ namaste rudra manyava utota iṣave namaḥ"},
{sequence:3,verse:2,devanagari:"नम॑स्ते अस्तु॒ धन्व॑ने बा॒हुभ्या॑मु॒त ते॒ नमः॑",transliteration:"namaste astu dhanvane bāhubhyāmuta te namaḥ"},
{sequence:4,verse:3,devanagari:"या त॒ इषुः॑ शि॒वत॑मा शि॒वं ब॒भूव॑ ते॒ धनुः॑",transliteration:"yā ta iṣuḥ śivatamā śivaṃ babhūva te dhanuḥ"},
{sequence:5,verse:3,devanagari:"शि॒वा श॑र॒व्या॑ या तव॒ तया॑ नो रुद्र मृडय",transliteration:"śivā śaravyā yā tava tayā no rudra mṛḍaya"},
{sequence:6,verse:4,devanagari:"या ते॑ रुद्र शि॒वा त॒नूरघो॒राऽपा॑पकाशिनी",transliteration:"yā te rudra śivā tanūraghorā'pāpakāśinī"},
{sequence:7,verse:4,devanagari:"तया॑ नस्त॒नुवा॒ शन्त॑मया॒ गिरि॑शंता॒भिचा॑कशीहि",transliteration:"tayā nastanuvā śantamayā giriśaṃtābhicākaśīhi"},
{sequence:8,verse:5,devanagari:"यामिषुं॑ गिरिशंत॒ हस्ते॒ बिभ॒र्ष्यस्त॑वे",transliteration:"yāmiṣuṃ giriśaṃta haste bibharṣyastave"},
{sequence:9,verse:5,devanagari:"शि॒वां गि॑रित्र॒ तां कु॑रु॒ मा हिग्ं॑सीः॒ पुरु॑षं॒ जग॑त्",transliteration:"śivāṃ giritra tāṃ kuru mā higṃsīḥ puruṣaṃ jagat"},
{sequence:10,verse:6,devanagari:"शि॒वेन॒ वच॑सा त्वा॒ गिरि॒शाच्छा॑वदामसि",transliteration:"śivena vacasā tvā giriśācchāvadāmasi"},
{sequence:11,verse:6,devanagari:"यथा॑ नः॒ सर्व॒मिज्जग॑दय॒क्ष्मग्ं सु॒मना॒ अस॑त्",transliteration:"yathā naḥ sarvamijjagadayakṣmagṃ sumanā asat"},
{sequence:12,verse:7,devanagari:"अध्य॑वोचदधिव॒क्ता प्र॑थ॒मो दैव्यो॑ भि॒षक्",transliteration:"adhyavocadadhivaktā prathamo daivyo bhiṣak"},
{sequence:13,verse:7,devanagari:"अहीग्॑श्च॒ सर्वा᳚ञ्ज॒म्भय॒न्त्सर्वा᳚श्च यातुधा॒न्यः॑",transliteration:"ahīgśca sarvāñjambhayantsarvāśca yātudhānyaḥ"},
{sequence:14,verse:8,devanagari:"अ॒सौ यस्ता॒म्रो अ॑रु॒ण उ॒त ब॒भ्रुः सु॑म॒ङ्गलः॑",transliteration:"asau yastāmro aruṇa uta babhruḥ sumaṅgalaḥ"},
{sequence:15,verse:8,devanagari:"ये चे॒माग्ं रु॒द्रा अ॒भितो॑ दि॒क्षु श्रि॒ताः स॑हस्र॒शोऽवै॑षा॒ग्ं॒ हेड॑ ईमहे",transliteration:"ye cemāgṃ rudrā abhito dikṣu śritāḥ sahasraśo'vaiṣāgṃ heḍa īmahe"},
{sequence:16,verse:9,devanagari:"अ॒सौ यो॑ऽव॒सर्प॑ति॒ नील॑ग्रीवो॒ विलो॑हितः",transliteration:"asau yo'vasarpati nīlagrīvo vilohitaḥ"},
{sequence:17,verse:9,devanagari:"उ॒तैनं॑ गो॒पा अ॑दृश॒न्नदृ॑शन्नुदहा॒र्यः॑",transliteration:"utainaṃ gopā adṛśannadṛśannudahāryaḥ"},
{sequence:18,verse:10,devanagari:"उ॒तैनं॒ विश्वा॑ भू॒तानि॒ स दृ॒ष्टो मृ॑डयाति नः",transliteration:"utainaṃ viśvā bhūtāni sa dṛṣṭo mṛḍayāti naḥ"},
{sequence:19,verse:11,devanagari:"नमो॑ अस्तु॒ नील॑ग्रीवाय सहस्रा॒क्षाय॑ मी॒ढुषे᳚",transliteration:"namo astu nīlagrīvāya sahasrākṣāya mīḍhuṣe"},
{sequence:20,verse:11,devanagari:"अथो॒ ये अ॑स्य॒ सत्त्वा॑नो॒ऽहं तेभ्यो॑ऽकर॒न्नमः॑",transliteration:"atho ye asya sattvāno'haṃ tebhyo'karannamaḥ"},
{sequence:21,verse:12,devanagari:"प्रमु॑ञ्च॒ धन्व॑न॒स्त्वमु॒भयो॒रार्त्नि॑ यो॒र्ज्याम्",transliteration:"pramuñca dhanvanastvamubhayorārtni yorjyām"},
{sequence:22,verse:12,devanagari:"याश्च॑ ते॒ हस्त॒ इष॑वः॒ परा॒ ता भ॑गवो वप",transliteration:"yāśca te hasta iṣavaḥ parā tā bhagavo vapa"},
{sequence:23,verse:13,devanagari:"अ॒व॒तत्य॒ धनु॒स्त्वग्ं सह॑स्राक्ष॒ शते॑षुधे",transliteration:"avatatya dhanustvagṃ sahasrākṣa śateṣudhe"},
{sequence:24,verse:13,devanagari:"नि॒शीर्य॑ श॒ल्यानां॒ मुखा॑ शि॒वो नः॑ सु॒मना॑ भव",transliteration:"niśīrya śalyānāṃ mukhā śivo naḥ sumanā bhava"},
{sequence:25,verse:14,devanagari:"विज्यं॒ धनुः॑ कप॒र्दिनो॒ विश॑ल्यो॒ बाण॑वाग्ं उ॒त",transliteration:"vijyaṃ dhanuḥ kapardino viśalyo bāṇavāgṃ uta"},
{sequence:26,verse:14,devanagari:"अने॑शन्न॒स्येष॑व आ॒भुर॑स्य निषं॒गथिः॑",transliteration:"aneśannasyeṣava ābhurasya niṣaṃgathiḥ"},
{sequence:27,verse:15,devanagari:"या ते॑ हे॒तिर्मी॑ढुष्टम॒ हस्ते॑ ब॒भूव॑ ते॒ धनुः॑",transliteration:"yā te hetirmīḍhuṣṭama haste babhūva te dhanuḥ"},
{sequence:28,verse:15,devanagari:"तया॒ऽस्मान् वि॒श्वत॒स्त्वम॑य॒क्ष्मया॒ परि॑ब्भुज",transliteration:"tayā'smān viśvatastvamayakṣmayā paribbhuja"},
{sequence:29,verse:16,devanagari:"नम॑स्ते अ॒स्त्वायु॑धा॒याना॑तताय धृ॒ष्णवे᳚",transliteration:"namaste astvāyudhāyānātatāya dhṛṣṇave"},
{sequence:30,verse:16,devanagari:"उ॒भभ्या॑मु॒त ते॒ नमो॑ बा॒हुभ्यां॒ तव॒ धन्व॑ने",transliteration:"ubhabhyāmuta te namo bāhubhyāṃ tava dhanvane"},
{sequence:31,verse:17,devanagari:"परि॑ ते॒ धन्व॑नो हे॒तिर॒स्मान्वृ॑णक्तु वि॒श्वतः॑",transliteration:"pari te dhanvano hetirasmānvṛṇaktu viśvataḥ"},
{sequence:32,verse:17,devanagari:"अथो॒ य इ॑षु॒धिस्तवा॒रे अ॒स्मन्निधे॑हि॒ तम्",transliteration:"atho ya iṣudhistavāre asmannidhehi tam"},
{sequence:33,verse:18,devanagari:"नम॑स्ते अस्तु भगवन्विश्वेश्व॒राय॑ महादे॒वाय॑ त्र्यम्ब॒काय॑ त्रिपुरान्त॒काय॑ त्रिकाग्निका॒लाय॑ कालाग्निरु॒द्राय॑ नीलक॒ण्ठाय॑ मृत्युञ्ज॒याय॑ सर्वेश्व॒राय॑ सदाशि॒वाय॑ श्रीमन्महादे॒वाय॒ नमः॑",transliteration:"namaste astu bhagavanviśveśvarāya mahādevāya tryambakāya tripurāntakāya trikāgnikālāya kālāgnirudrāya nīlakaṇṭhāya mṛtyuñjayāya sarveśvarāya sadāśivāya śrīmanmahādevāya namaḥ"}
];

/* The reading unit is the printed verse group; never split across pages. */
const UNITS = (() => {
  const out = [];
  for (const [i, ln] of LINES.entries()) {
    const last = out[out.length - 1];
    if (last && last.verse === ln.verse) last.idx.push(i);
    else out.push({ verse: ln.verse, idx: [i] });
  }
  return out;
})();
const ROMAN = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII"];

const STATE_WORDS = {
  following:{word:"Following.",sub:"Your voice is being tracked line by line."},
  holding:{word:"Holding your place.",sub:"Still on the last line it was sure of."},
  locating:{word:"Finding your place…",sub:"It can hear you, but has not found the line yet."},
  starting:{word:"Starting…",sub:"Opening the microphone and waking the model."},
  idle:{word:"Not listening.",sub:"The microphone is off. Nothing is being heard."},
};
const MEANING_LINE1 = "Prostrations to Lord Rudra, who is the destroyer of sin and sorrow.";

/* ============================== elements =============================== */
const $ = (id) => document.getElementById(id);
const stage=$("stage"), leafbox=$("leafbox"), measurer=$("measurer");
const leaves=[$("leafA"),$("leafB")];
const folioEl=$("folio"), headrule=$("headrule"), headwhere=$("headwhere");
const pgPrev=$("pgPrev"), pgNext=$("pgNext");
const ribbon=$("ribbon"), ribbontext=$("ribbontext");
const sheetEl=$("sheetEl"), barrow=$("barrow"), sheetbody=$("sheetbody"), scrim=$("scrim");
const wellbtn=$("wellbtn"), wellink=$("wellink");
const statesays=$("statesays"), statesr=$("statesr");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================ reading state ============================ */
let pos = 0;          // line index the voice (or the hand) is on
let prog = 0;         // 0..1 through that line
let running = false;  // microphone session simulated
let cond = "idle";    // idle | starting | locating | following | holding
let lead = "dev";
let sizeStep = 1; const SIZES=[0.86,1,1.18];

let pages = [];       // arrays of unit indices
let lineToPage = [];  // line index → page index
let shown = 0;        // page on screen
let front = 0;        // which leaf div is on
let lineEls = {};     // line index → node handles for the shown page
let turning = null;

const words = LINES.map(l => ({
  dev: l.devanagari.split(/\s+/).filter(Boolean),
  ia:  l.transliteration.split(/\s+/).filter(Boolean),
}));
const leadWords = (i) => lead==="dev" ? words[i].dev : words[i].ia;
const secWords  = (i) => lead==="dev" ? words[i].ia  : words[i].dev;

/* =========================== building a leaf =========================== */
function lineDOM(i){
  const l = LINES[i];
  const ln = document.createElement("div");
  ln.className = "ln"; ln.dataset.i = i;

  const mk = (cls, langAttr, list) => {
    const p = document.createElement("p");
    p.className = cls; p.setAttribute("lang", langAttr);
    const spans = [];
    list.forEach((w, k) => {
      if (k) p.appendChild(document.createTextNode(" "));
      const s = document.createElement("span");
      s.textContent = w; p.appendChild(s); spans.push(s);
    });
    return { p, spans };
  };
  const leadIsDev = lead === "dev";
  const a = mk("lead",  leadIsDev ? "sa" : "sa-Latn", leadWords(i));
  const b = mk("second",leadIsDev ? "sa-Latn" : "sa", secWords(i));
  const prog = document.createElement("div");
  prog.className = "prog"; prog.innerHTML = "<i></i>";
  ln.append(a.p, b.p, prog);
  return { ln, leadSpans: a.spans, secSpans: b.spans, progI: prog.firstChild };
}

function unitDOM(u){
  const el = document.createElement("div");
  el.className = "unit";
  const handles = [];
  for (const i of UNITS[u].idx) { const h = lineDOM(i); el.appendChild(h.ln); handles.push({ i, ...h }); }
  return { el, handles };
}

/* Pagination is measured, not guessed: fill the real box, break where the
   next whole unit would not fit. A unit taller than the leaf (the closing
   salutation at Large) gets a page to itself. */
function paginate(){
  measurer.textContent = "";
  const avail = measurer.clientHeight - 32; // the measurer's own padding
  pages = []; lineToPage = [];
  let cur = [], h = 0;
  for (let u = 0; u < UNITS.length; u++) {
    const { el } = unitDOM(u);
    measurer.appendChild(el);
    const uh = el.offsetHeight + 14;
    if (cur.length && h + uh > avail) { pages.push(cur); cur = []; h = 0; }
    cur.push(u); h += uh;
  }
  if (cur.length) pages.push(cur);
  measurer.textContent = "";
  pages.forEach((units, p) => units.forEach(u => UNITS[u].idx.forEach(i => lineToPage[i] = p)));
}

function renderPage(p, leafEl){
  leafEl.textContent = "";
  const map = {};
  for (const u of pages[p]) {
    const { el, handles } = unitDOM(u);
    leafEl.appendChild(el);
    for (const h of handles) map[h.i] = h;
  }
  return map;
}

/* =========================== ink on the leaf =========================== */
function applyInk(){
  for (const key in lineEls) {
    const i = +key, h = lineEls[key];
    h.ln.classList.toggle("done", i < pos || (i === pos && cond === "holding" && prog >= 1));
    h.ln.classList.toggle("now", i === pos && !(cond === "holding" && prog >= 1));
    if (i !== pos) {
      for (const s of h.leadSpans) s.className = "";
      for (const s of h.secSpans) s.className = "";
      h.progI && (h.progI.style.width = "0");
    }
  }
  paintFrame(true);
}

let lastReach = -1;
function paintFrame(force){
  const h = lineEls[pos];
  if (!h || !h.ln.classList.contains("now")) return;
  const total = h.leadSpans.length;
  const reach = Math.min(total - (prog < 1 ? 1 : 0), Math.floor(prog * total));
  // The wet edge belongs to a live voice only; a paused line keeps its dry ink.
  const wet = running && cond === "following";
  if (force || reach !== lastReach) {
    lastReach = reach;
    h.leadSpans.forEach((s, k) => { s.className = k < reach ? "inked" : (k === reach && prog < 1 && wet ? "nowword" : ""); });
    const secTotal = h.secSpans.length;
    const secReach = total ? Math.floor(reach * secTotal / total) : 0;
    h.secSpans.forEach((s, k) => { s.className = k < secReach ? "inked" : ""; });
  }
  const now = h.leadSpans[reach];
  if (now && now.className === "nowword") {
    const wp = Math.max(0, Math.min(100, (prog * total - reach) * 100));
    now.style.setProperty("--wp", wp + "%");
  }
  h.progI.style.width = (Math.min(1, prog) * 100) + "%";
}

/* ============================== the turn =============================== */
function turnTo(p, dir, instant){
  p = Math.max(0, Math.min(pages.length - 1, p));
  if (p === shown && !instant) { apparatus(); return; }
  if (turning) { clearTimeout(turning); leaves[1 - front].classList.remove("in-f","in-b","out-f","out-b"); }
  const outLeaf = leaves[front], inLeaf = leaves[1 - front];
  shown = p; front = 1 - front;
  lineEls = renderPage(p, inLeaf);
  inLeaf.toggleAttribute("data-on", true);
  outLeaf.classList.remove("in-f","in-b","out-f","out-b");
  inLeaf.classList.remove("in-f","in-b","out-f","out-b");
  if (instant) {
    outLeaf.removeAttribute("data-on");
  } else {
    const fwd = dir >= 0;
    outLeaf.classList.add(fwd ? "out-f" : "out-b");
    inLeaf.classList.add(fwd ? "in-f" : "in-b");
    turning = setTimeout(() => {
      outLeaf.removeAttribute("data-on");
      outLeaf.classList.remove("out-f","out-b");
      turning = null;
    }, reduced ? 140 : 260);
  }
  lastReach = -1;
  applyInk();
  apparatus();
}

/* ======================= apparatus (head, ribbon) ====================== */
function apparatus(){
  folioEl.textContent = "Page " + (shown + 1) + " of " + pages.length;
  pgPrev.disabled = shown === 0;
  pgNext.disabled = shown === pages.length - 1;
  headrule.querySelector("i").style.transform =
    "scaleX(" + Math.min(1, (pos + Math.min(1, prog)) / LINES.length).toFixed(4) + ")";
  const home = lineToPage[pos];
  const away = home !== shown && !sheetOpen;
  if (away) ribbontext.textContent =
    (running ? "The voice is on page " : "Your place is on page ") + (home + 1) + " — return";
  ribbon.toggleAttribute("data-shown", away);
  gloss();
}

function gloss(){
  const l = LINES[pos];
  const u = UNITS.find(x => x.verse === l.verse);
  const first = LINES[u.idx[0]].sequence, last = LINES[u.idx[u.idx.length-1]].sequence;
  $("glossref").textContent = "Namakam · Anuvaka I · Verse " + (ROMAN[l.verse] || l.verse) +
    " · " + (first === last ? "Line " + first : "Lines " + first + "–" + last);
  $("glossbody").innerHTML = l.sequence === 1
    ? '<div class="en">' + MEANING_LINE1 + "</div>"
    : '<div class="none">No translation is loaded for this verse. A translation is an interpretation rather than a transcription — it needs a named edition rather than being filled in from memory.</div>';
}

/* ====================== state words + the well ========================= */
const SHOWNSTATES = ["idle","starting","locating","following","holding"];
for (const key of SHOWNSTATES) {
  const d = document.createElement("div");
  d.className = "say"; d.dataset.k = key;
  d.innerHTML = '<div class="word"></div><div class="sub"></div>';
  d.firstChild.textContent = STATE_WORDS[key].word;
  d.lastChild.textContent = STATE_WORDS[key].sub;
  statesays.appendChild(d);
}
function setCond(c){
  cond = c;
  for (const d of statesays.children) d.toggleAttribute("data-on", d.dataset.k === c);
  statesr.textContent = STATE_WORDS[c].word + " " + STATE_WORDS[c].sub;
  wellbtn.dataset.condition = c === "starting" ? "locating" : c;
  const live = running || c === "starting";
  wellbtn.toggleAttribute("data-live", running);
  wellbtn.toggleAttribute("data-busy", c === "starting");
  wellbtn.disabled = c === "starting";
  wellbtn.setAttribute("aria-pressed", String(live));
  wellbtn.setAttribute("aria-label", live ? "Pause listening" : "Begin listening");
  $("pwBegin").toggleAttribute("data-on", !live);
  $("pwPause").toggleAttribute("data-on", live);
}

/* ========================= the simulated voice ========================= */
const durOf = (i) => 1700 + 560 * words[i].ia.length; // ≈4–6 s a typical line
let lastT = 0, raf = 0;

function loop(t){
  raf = requestAnimationFrame(loop);
  const dt = lastT ? t - lastT : 0; lastT = t;
  if (running && cond === "following") {
    prog += dt / durOf(pos);
    if (prog >= 1) {
      if (pos >= LINES.length - 1) { prog = 1; setCond("holding"); applyInk(); }
      else {
        const wasHome = lineToPage[pos] === shown;
        pos += 1; prog = 0; lastReach = -1;
        if (wasHome && lineToPage[pos] !== shown) turnTo(lineToPage[pos], +1);
        else applyInk();
      }
    }
    // the ink inside the well rides a simulated voice
    const level = Math.max(.05, Math.min(.95,
      .34 + .26 * Math.sin(t / 640) + .18 * Math.sin(t / 233 + 1.7)));
    wellink.style.setProperty("--ink", (.3 + level * .7).toFixed(3));
    paintFrame(false);
    headrule.querySelector("i").style.transform =
      "scaleX(" + Math.min(1, (pos + prog) / LINES.length).toFixed(4) + ")";
  } else if (cond === "holding") {
    wellink.style.setProperty("--ink", ".45");
  }
}
raf = requestAnimationFrame(loop);

wellbtn.addEventListener("click", (e) => {
  e.stopPropagation();
  if (running || cond === "starting") {           // pause: rise, dry, keep place
    running = false; setCond("idle"); wellink.style.setProperty("--ink","0");
    applyInk(); apparatus();
  } else {                                        // begin: sink, latch, follow
    if (pos >= LINES.length - 1 && prog >= 1) { pos = 0; prog = 0; }
    setCond("starting");
    setTimeout(() => {
      running = true; setCond("following");
      prog = 0; lastReach = -1;
      turnTo(lineToPage[pos], +1, lineToPage[pos] === shown);
      applyInk();
    }, 1200);
  }
});

/* ================== touching a line · turning by hand ================== */
let swiped = false;
leafbox.addEventListener("click", (e) => {
  if (swiped) { swiped = false; return; }
  const ln = e.target.closest(".ln");
  if (!ln) return;
  pos = +ln.dataset.i; prog = 0; lastReach = -1;   // a tap places the voice
  if (running) setCond("following");
  applyInk(); apparatus();
});

function handTurn(dir){
  const p = shown + dir;
  if (p < 0 || p >= pages.length) return;
  turnTo(p, dir);
}
pgPrev.addEventListener("click", () => handTurn(-1));
pgNext.addEventListener("click", () => handTurn(+1));
addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown") handTurn(+1);
  if (e.key === "ArrowLeft"  || e.key === "PageUp")   handTurn(-1);
});

/* swipe: the leaf follows the finger a little, then either turns or settles */
let sx = 0, sy = 0, dragging = false;
leafbox.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; dragging = true; });
leafbox.addEventListener("pointermove", (e) => {
  if (!dragging || turning) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
    swiped = true;
    leaves[front].style.transform = "translateX(" + (dx * .16) + "px)";
  }
});
function endSwipe(e){
  if (!dragging) return; dragging = false;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  const leaf = leaves[front];
  leaf.style.transition = "transform 360ms var(--ease)";
  leaf.style.transform = "";
  setTimeout(() => { leaf.style.transition = ""; }, 380);
  if (Math.abs(dx) > 48 && Math.abs(dy) < 60) handTurn(dx < 0 ? +1 : -1);
  setTimeout(() => { swiped = false; }, 0);
}
leafbox.addEventListener("pointerup", endSwipe);
leafbox.addEventListener("pointercancel", endSwipe);

ribbon.addEventListener("click", () => {
  const home = lineToPage[pos];
  turnTo(home, home > shown ? +1 : -1);
});

/* ======================== the bar and the sheet ======================== */
let sheetOpen = false, sheetH = 0, barH = 0, y = 0;
function metrics(){
  sheetH = sheetEl.offsetHeight;
  barH = barrow.offsetHeight;
  stage.style.setProperty("--barh", barH + "px");
}
/* Only a live drag writes pixels; at rest the position is the stylesheet's. */
function setY(v){
  y = Math.max(0, Math.min(sheetH - barH, v));
  sheetEl.classList.remove("settle");
  sheetEl.style.transform = "translateY(" + y + "px)";
}
function openSheet(o){
  sheetOpen = o;
  sheetEl.classList.add("settle");
  sheetEl.style.transform = "";
  sheetEl.classList.toggle("open", o);
  scrim.toggleAttribute("data-shown", o);
  scrim.style.opacity = "";
  apparatus();
}
scrim.addEventListener("click", () => openSheet(false));

/* drag the bar row; a still touch is a tap and toggles */
let by = 0, byY = 0, bt = 0, bMoved = false, bDragging = false;
barrow.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".wellbtn")) return;
  metrics();
  bDragging = true; by = e.clientY; byY = sheetOpen ? 0 : sheetH - barH;
  bt = performance.now(); bMoved = false;
  try { barrow.setPointerCapture(e.pointerId); } catch {}
});
barrow.addEventListener("pointermove", (e) => {
  if (!bDragging) return;
  const dy = e.clientY - by;
  if (Math.abs(dy) > 6) bMoved = true;
  if (bMoved) {
    setY(byY + dy);
    scrim.toggleAttribute("data-shown", true);
    scrim.style.opacity = String(Math.max(0, 1 - y / (sheetH - barH)));
  }
});
barrow.addEventListener("pointerup", (e) => {
  if (!bDragging) return; bDragging = false;
  if (!bMoved) { openSheet(!sheetOpen); return; }
  const dy = e.clientY - by, dt = performance.now() - bt;
  const fling = Math.abs(dy) > 24 && dt < 300;
  openSheet(fling ? dy < 0 : y < (sheetH - barH) / 2);
});

/* ========================== the open sheet ============================= */
const NAV = [
  { lbl:"Namakam", items:Array.from({length:11},(_,k)=>({ label:ROMAN[k+1], loaded:k===0 })) },
  { lbl:"", items:[{ label:"Rudra", loaded:false }] },
  { lbl:"Chamakam", items:Array.from({length:11},(_,k)=>({ label:ROMAN[k+1], loaded:false })) },
  { lbl:"", items:[{ label:"Śānti", loaded:false }] },
];
const navrows = $("navrows");
let noteTimer = 0;
for (const row of NAV) {
  const r = document.createElement("div");
  r.className = "navrow";
  const lbl = document.createElement("span");
  lbl.className = "navlbl"; lbl.textContent = row.lbl || " ";
  r.appendChild(lbl);
  for (const item of row.items) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = item.label;
    if (item.loaded) b.classList.add("here");
    b.addEventListener("click", () => {
      if (item.loaded) {
        pos = 0; prog = 0; lastReach = -1;
        openSheet(false);
        turnTo(0, -1, true); applyInk(); apparatus();
      } else {
        const note = $("navnote");
        note.textContent = "Only Anuvaka I of Namakam is loaded in this design demo.";
        note.toggleAttribute("data-shown", true);
        clearTimeout(noteTimer);
        noteTimer = setTimeout(() => note.removeAttribute("data-shown"), 2600);
      }
    });
    r.appendChild(b);
  }
  navrows.appendChild(r);
}
$("navnote").toggleAttribute("data-shown", false);

/* choice groups with the travelling underline */
function wireChoices(id, initial, onPick){
  const box = $(id);
  const slide = () => {
    const on = box.querySelector("[data-on]");
    if (!on) { box.style.setProperty("--o","0"); return; }
    box.style.setProperty("--o","1");
    box.style.setProperty("--x", on.offsetLeft + "px");
    box.style.setProperty("--y", (on.offsetTop + on.offsetHeight - 8) + "px");
    box.style.setProperty("--w", String(on.offsetWidth));
  };
  const pick = (v, first) => {
    for (const b of box.querySelectorAll("button"))
      b.toggleAttribute("data-on", b.dataset.v === v);
    if (first) { box.toggleAttribute("data-jump", true); slide();
      requestAnimationFrame(() => box.removeAttribute("data-jump")); }
    else slide();
    if (!first) onPick(v);
  };
  box.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (b) pick(b.dataset.v, false);
  });
  pick(initial, true);
  new ResizeObserver(() => { box.toggleAttribute("data-jump", true); slide();
    requestAnimationFrame(() => box.removeAttribute("data-jump")); }).observe(box);
}

function reflow(){
  // Type changed size or face: repaginate, recount the folio, and put the
  // reader back on the voice's page — a reflowed leaf number is meaningless.
  paginate();
  turnTo(lineToPage[pos] ?? 0, +1, true);
}
wireChoices("cLead", "dev", (v) => { lead = v; stage.dataset.lead = v; reflow(); });
wireChoices("cSize", "1", (v) => { sizeStep = +v; stage.style.setProperty("--scale", String(SIZES[sizeStep])); reflow(); });
wireChoices("cLight", "dawn", (v) => { stage.dataset.light = v; });

/* microphone picker — enumerate if the browser will say, never demand */
if (navigator.mediaDevices?.enumerateDevices) {
  navigator.mediaDevices.enumerateDevices().then((list) => {
    const mics = list.filter(d => d.kind === "audioinput" && d.label);
    for (const m of mics) {
      const o = document.createElement("option");
      o.value = m.deviceId; o.textContent = m.label;
      $("micsel").appendChild(o);
    }
  }).catch(() => {});
}

/* ============================= first light ============================= */
function boot(){
  metrics();
  paginate();
  lineEls = renderPage(0, leaves[front]);
  leaves[front].classList.add("in-b");
  applyInk(); apparatus();
  setCond("idle");
}
requestAnimationFrame(boot);

let rsTimer = 0;
addEventListener("resize", () => {
  clearTimeout(rsTimer);
  rsTimer = setTimeout(() => { metrics(); reflow(); }, 180);
});
if (document.fonts?.ready) document.fonts.ready.then(() => { metrics(); reflow(); });
</script>
</body>
</html>
