<!doctype html>
<!--
  M-C — "the breath" · Voice Seva mobile design direction
  ═══════════════════════════════════════════════════════

  TOPOLOGY. The current verse-unit alone, set large and centred on the paper;
  the unit just chanted ghosted above, the unit to come ghosted below. Advance
  is replacement, not scrolling: the finished unit recedes upward and pales
  into the ghost above, and the next resolves into the centre the way an
  impression meets paper — a small rise, a blur clearing, 560 ms on the
  page's own exponential ease. Nothing slides continuously and nothing
  bounces.

  ASSUMPTIONS
  · Default polarity is DAWN. The scene is a dim room before sunrise; a light
    page at 5 a.m. is a lamp pointed at the reciter's face. Lamp exists behind
    the Appearance control, one tap away.
  · The verse-unit is the built app's unit: lines grouped by printed verse
    number (the invocation stands alone, verses are couplets, the closing
    salutation of line 33 is one long breath). Type size is decided
    deterministically from the unit's own length — three steps, so the
    salutation is never comically large and the invocation is never timid.
  · The unit's type scale is the topology's gift and is spent: the invocation
    sets at 38 px Devanagari, couplets at 28 px, the long salutation at 21 px,
    all × the user's size step, all at line-height ≥ 1.9 so svara never
    collide. Both scripts are always present in the centre; ghosts carry the
    leading script only, at full ink2 contrast — the ghosting is size and
    position, never brightness alone.
  · Correcting a wrong position by touch: the ghosts are whole-width buttons
    (≥ 64 px tall) — tap above to step back a unit, below to step forward.
    Reaching further is a vertical swipe on the paper (each flick is one
    breath; flicks chain), or the sheet's full 24-section navigation for a
    real jump. A hand-placed position pins, exactly as in the app.
  · A section boundary arrives as a replacement like any other: the last unit
    recedes and what resolves into the centre is the section's own leaf — the
    new section's name between two full rules, held as a breath before its
    first verse. In this demo the text beyond Anuvaka 1 is not carried, so
    the leaf holds and the state words say, honestly, "Holding your place."
  · The well button is the app's instrument verbatim at 56 px — same SVG
    bowl, same ink, same latch, same shadows trading places — re-housed in
    the collapsed bar. The Appearance control uses the shipped app's words
    ("Light mode / Dark mode"), since the built app is the visual authority
    and it renamed the earlier "Lamp / Before dawn".
  · The bar collapsed shows only the well + state words + the grabber. Drag
    or tap the grabber to expand; the sheet settles without spring.
  · No translation exists beyond the one recorded meaning for line 1; the
    sheet says so in the app's own words rather than inventing one.

  §9 — WHY THIS TOPOLOGY IS RIGHT FOR A PHONE CARRYING A VOICE THROUGH
  SCRIPTURE. Vedic recitation is not read, it is breathed: the reciter is
  inside one utterance at a time, and for the length of that breath the rest
  of the text does not exist for them. A scroll or a page keeps the whole
  neighbourhood in view and asks the eye to keep finding its place in it; on
  a phone held at 40 cm before dawn, that is work the chant pays for. The
  breath topology gives the screen the same shape as the voice: exactly one
  unit, set large enough to be read without searching, with memory above and
  anticipation below — the two things a reciter actually holds. And because
  advance is replacement, the screen never implies a tempo. A scrolling page
  moves at a rate and the voice feels measured against it; a replaced page
  only ever answers a breath that has already happened. The screen follows;
  it never conducts. That is why this is not a lyrics player: a lyrics
  display drags text past a listener at the recording's pace, while this
  page holds still and is turned, breath by breath, by the reciter alone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M-C · the breath — Voice Seva</title>
<style>
  /* ── the world's materials, inherited from the built app ─────────────── */
  .vs-stage{
    --dev:"Noto Sans Devanagari","Noto Serif Devanagari","Kohinoor Devanagari","Devanagari MT",sans-serif;
    --book:"Iowan Old Style","Palatino","Palatino Linotype","Hoefler Text",Charter,Georgia,serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  .vs-stage[data-light="lamp"]{
    --page:#E8E1D3; --paper:#F1EBDE;
    --ink:#221B12; --ink2:#5C5245; --ink3:#6F6456;
    --blue:#0C5098; --rule:rgba(12,80,152,.32); --rule-soft:rgba(12,80,152,.17);
    --saffron:#9C4A05; --saffron-full:#EE7900;
    --key-well:rgba(120,70,20,.18); --well-sheen:rgba(255,255,255,.55);
    --scrim:rgba(34,27,18,.34);
  }
  .vs-stage[data-light="dawn"]{
    --page:#131110; --paper:#1C1917;
    --ink:#EDE6D8; --ink2:#A99C88; --ink3:#9C907D;
    --blue:#8FB3DC; --rule:rgba(143,179,220,.34); --rule-soft:rgba(143,179,220,.18);
    --saffron:#EE9A45; --saffron-full:#EE7900;
    --key-well:rgba(0,0,0,.42); --well-sheen:rgba(255,255,255,.07);
    --scrim:rgba(0,0,0,.5);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; height:100%; overscroll-behavior:none}
  .vs-stage{
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    background:var(--page); color:var(--ink);
    font-family:var(--book); font-size:16px;
    transition:background .5s ease, color .5s ease;
  }
  .vs-stage button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; text-align:inherit}

  /* ── running head: one quiet line ────────────────────────────────────── */
  .vs-head{
    flex:none; display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; padding:calc(10px + env(safe-area-inset-top)) 20px 8px;
    border-bottom:1px solid var(--rule-soft);
  }
  .vs-head .vs-workname{font-style:italic; font-size:15px; color:var(--ink2)}
  .vs-head .vs-where{font-size:13px; color:var(--ink2)}

  /* ── the breath: ghost above · centre · ghost below ──────────────────── */
  .vs-reading{
    flex:1; min-height:0; display:flex; flex-direction:column;
    padding-bottom:var(--barh,118px); touch-action:none; position:relative;
  }
  .vs-drift{flex:1; min-height:0; display:flex; flex-direction:column}

  .vs-stage .vs-ghost{
    flex:none; display:block; width:100%; padding:8px 26px; overflow:hidden;
    min-height:64px; max-height:118px; color:var(--ink2); text-align:center;
    cursor:pointer;
  }
  .vs-stage .vs-ghost:empty{cursor:default}
  .vs-ghost .vs-gtext{display:block; font-size:16px; line-height:1.9}
  .vs-ghost .vs-gtext[lang="sa"]{font-family:var(--dev)}
  .vs-ghost .vs-gtext[lang="sa-Latn"]{font-family:var(--book); font-style:italic; line-height:1.7}
  .vs-stage .vs-ghost-prev, .vs-stage .vs-ghost-next{display:flex; flex-direction:column}
  .vs-ghost-prev{justify-content:flex-end;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 55%);
            mask-image:linear-gradient(to bottom,transparent 0,#000 55%)}
  .vs-ghost-next{justify-content:flex-start;
    -webkit-mask-image:linear-gradient(to top,transparent 0,#000 55%);
            mask-image:linear-gradient(to top,transparent 0,#000 55%)}
  .vs-gin{animation:vs-ghostin 420ms var(--ease) 90ms backwards}
  @keyframes vs-ghostin{from{opacity:0}to{opacity:1}}

  .vs-center{
    flex:1; min-height:0; position:relative;
    display:flex; flex-direction:column; justify-content:center;
    padding:6px 20px;
  }
  .vs-centerinner{text-align:center}
  /* the impression: rise a breath, blur clearing — the app's own grammar */
  .vs-af{animation:vs-arrive-f 560ms var(--ease)}
  .vs-ab{animation:vs-arrive-b 560ms var(--ease)}
  @keyframes vs-arrive-f{from{opacity:0; transform:translateY(16px); filter:blur(2.5px)}
                         to{opacity:1; transform:none; filter:blur(0)}}
  @keyframes vs-arrive-b{from{opacity:0; transform:translateY(-16px); filter:blur(2.5px)}
                         to{opacity:1; transform:none; filter:blur(0)}}

  .vs-eyebrow{font-size:13px; font-style:italic; color:var(--ink2); margin-bottom:14px}

  /* the unit: type scale decided by the unit's own length, × the size step */
  .vs-unit{--scale:1}
  .vs-ln{cursor:pointer; padding:6px 0}
  .vs-leadtext{color:var(--ink); transition:color .45s ease}
  .vs-leadtext[lang="sa"]{font-family:var(--dev); line-height:1.95}
  .vs-leadtext[lang="sa-Latn"]{font-family:var(--book); line-height:1.6}
  .vs-second{display:block; margin-top:4px; color:var(--ink2); line-height:1.9}
  .vs-second[lang="sa-Latn"]{font-family:var(--book); font-style:italic; line-height:1.62}
  .vs-second[lang="sa"]{font-family:var(--dev)}

  .vs-unit[data-size="s1"] .vs-leadtext[lang="sa"]{font-size:calc(38px * var(--scale))}
  .vs-unit[data-size="s2"] .vs-leadtext[lang="sa"]{font-size:calc(28px * var(--scale))}
  .vs-unit[data-size="s3"] .vs-leadtext[lang="sa"]{font-size:calc(21px * var(--scale))}
  .vs-unit[data-size="s1"] .vs-leadtext[lang="sa-Latn"]{font-size:calc(32px * var(--scale))}
  .vs-unit[data-size="s2"] .vs-leadtext[lang="sa-Latn"]{font-size:calc(24px * var(--scale))}
  .vs-unit[data-size="s3"] .vs-leadtext[lang="sa-Latn"]{font-size:calc(18px * var(--scale))}
  .vs-unit[data-size="s1"] .vs-second{font-size:calc(20px * var(--scale))}
  .vs-unit[data-size="s2"] .vs-second{font-size:calc(16px * var(--scale))}
  .vs-unit[data-size="s3"] .vs-second{font-size:calc(14px * var(--scale))}

  /* the voice's ink — the app's word-ink verbatim */
  .vs-inked{color:var(--saffron)}
  .vs-nowword{
    background-image:linear-gradient(90deg,
      var(--saffron) 0 calc(var(--wp,0%) - 4px),
      var(--ink) calc(var(--wp,0%) + 9px) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .vs-prog{display:block; width:min(150px,44%); margin:14px auto 0; height:2px;
    background:var(--rule-soft); position:relative; overflow:hidden}
  .vs-prog i{position:absolute; inset:0; background:var(--saffron-full);
    transform:scaleX(var(--glide,0)); transform-origin:0 50%}

  /* the section leaf: what a boundary looks like when it arrives */
  .vs-leaf{text-align:center; padding:8px 0}
  .vs-leafrule{height:1px; background:var(--rule); margin:0 8%}
  .vs-leafwork{font-size:14px; font-style:italic; color:var(--ink2); margin:26px 0 6px}
  .vs-leafname{font-size:27px; color:var(--ink); font-family:var(--book); margin-bottom:26px}
  .vs-leafnote{font-size:14px; font-style:italic; color:var(--ink2); line-height:1.6;
    margin:20px 10% 0}

  /* ── the sheet ────────────────────────────────────────────────────────── */
  .vs-scrim{position:fixed; inset:0; background:var(--scrim); opacity:0;
    pointer-events:none; transition:opacity 420ms var(--ease); z-index:8}
  .vs-scrim[data-on="true"]{opacity:1; pointer-events:auto}

  .vs-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:9;
    height:min(78dvh,640px);
    background:var(--paper); border-top:1px solid var(--rule);
    border-radius:16px 16px 0 0;
    box-shadow:0 -10px 28px var(--key-well);
    display:flex; flex-direction:column;
    transition:transform 520ms var(--ease), background .5s ease;
    will-change:transform;
  }
  .vs-sheet[data-drag="true"]{transition:background .5s ease}
  .vs-grip{flex:none; height:26px; display:flex; align-items:center;
    justify-content:center; cursor:grab; touch-action:none; padding-top:6px}
  .vs-grip i{display:block; width:38px; height:4px; border-radius:2px;
    background:var(--rule); pointer-events:none}

  .vs-bar{flex:none; display:flex; align-items:center; gap:16px;
    padding:0 20px 12px}
  .vs-press{flex:none; width:74px; display:flex; flex-direction:column;
    align-items:center; gap:6px}

  /* ── the living well, verbatim at 56 px ───────────────────────────────── */
  .vs-wellbtn{
    display:block; width:56px; height:56px; padding:0; border:0;
    border-radius:50%; cursor:pointer; background:var(--paper);
    box-shadow:0 2px 0 var(--key-well), 0 6px 14px var(--key-well),
      inset 0 1px 0 var(--well-sheen);
    transition:transform 90ms var(--ease), box-shadow 240ms var(--ease),
      background 520ms var(--ease);
  }
  .vs-wellbtn:hover:not(:disabled):not([data-live="true"]){
    transform:translateY(-1px);
    box-shadow:0 3px 0 var(--key-well), 0 9px 18px var(--key-well),
      inset 0 1px 0 var(--well-sheen);
  }
  .vs-wellbtn:active:not(:disabled),
  .vs-wellbtn[data-live="true"],
  .vs-wellbtn[data-busy="true"]{
    transform:translateY(2px);
    box-shadow:0 0 0 var(--key-well), 0 1px 2px var(--key-well),
      inset 0 2px 5px var(--key-well);
  }
  .vs-wellbtn:disabled{cursor:default}
  .vs-wellbtn:focus-visible{outline:2px solid var(--blue); outline-offset:3px}
  .vs-well{width:100%; height:100%; overflow:visible; display:block;
    transform-origin:50% 50%; transition:transform 420ms var(--ease)}
  .vs-rim{fill:none; stroke:var(--ink3); stroke-width:1.5;
    transition:stroke 520ms var(--ease), opacity 520ms var(--ease)}
  .vs-ink{--ink:0; fill:var(--saffron-full); transform-box:view-box;
    transform:translateY(calc((1 - var(--ink)) * 100%));
    transition:fill 520ms var(--ease), opacity 520ms var(--ease)}
  .vs-drop{fill:var(--saffron-full); opacity:0; transition:opacity 300ms var(--ease)}
  .vs-wellbtn:hover:not(:disabled)[data-condition="idle"] .vs-drop{opacity:.3}
  .vs-draw{fill:none; stroke:var(--blue); stroke-width:1.6; stroke-linecap:round;
    stroke-dasharray:144.5; stroke-dashoffset:144.5; opacity:0; transform-origin:50% 50%}
  [data-condition="idle"] .vs-ink{opacity:0}
  [data-condition="idle"] .vs-rim{stroke:var(--ink3)}
  [data-condition="locating"] .vs-rim{stroke:var(--blue); opacity:.35}
  [data-condition="locating"] .vs-ink{opacity:0}
  [data-condition="locating"] .vs-draw{opacity:1;
    animation:vs-lap 1.5s cubic-bezier(.62,0,.38,1) infinite, vsturn 3s linear infinite}
  [data-condition="following"] .vs-rim{stroke:var(--saffron-full)}
  [data-condition="following"] .vs-ink{opacity:1}
  [data-condition="following"] .vs-well{animation:vsbreathe 4.4s ease-in-out infinite}
  [data-condition="holding"] .vs-rim{stroke:var(--saffron-full); opacity:.75}
  [data-condition="holding"] .vs-ink{opacity:.34}
  @keyframes vsturn{to{transform:rotate(360deg)}}
  @keyframes vsbreathe{0%,100%{transform:scale(.97)}50%{transform:scale(1)}}
  @keyframes vs-lap{0%{stroke-dashoffset:144.5}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-144.5}}

  .vs-pressword{font-size:13px; font-style:italic; color:var(--ink2);
    text-align:center; white-space:nowrap}
  .vs-pressword .vs-says{justify-items:center}

  /* state words: every state in the DOM, stacked, cross-fading in place */
  .vs-txt{flex:1; min-width:0}
  .vs-says{display:grid}
  .vs-say{grid-area:1/1; opacity:0; transform:translateY(-5px);
    transition:opacity 400ms var(--ease), transform 400ms var(--ease);
    pointer-events:none}
  .vs-say[data-on="true"]{opacity:1; transform:none}
  .vs-say:not([data-on="true"]){transition-duration:220ms}
  .vs-word{font-family:var(--book); font-size:19px; line-height:1.3}
  .vs-sub{font-size:13px; color:var(--ink2); margin-top:3px; line-height:1.5}
  .vs-sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0}

  /* ── the sheet's open leaf ────────────────────────────────────────────── */
  .vs-more{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    padding:4px 20px calc(22px + env(safe-area-inset-bottom));
    border-top:1px solid var(--rule-soft)}
  .vs-more h2{font-size:13px; font-style:italic; font-weight:400;
    color:var(--ink2); margin:20px 0 4px}
  .vs-navrow{display:flex; align-items:baseline; flex-wrap:wrap; position:relative;
    margin-bottom:2px}
  .vs-lbl{flex:none; font-size:14px; font-style:italic; color:var(--ink2);
    min-width:78px; padding:9px 0}
  .vs-navrow button{color:var(--blue); opacity:.55; font-size:16px;
    padding:9px 10px; min-height:44px}
  .vs-navrow button:hover{opacity:.9}
  .vs-navrow button.vs-here{color:var(--ink); opacity:1; font-weight:600}
  .vs-navrow button[data-on="true"]{opacity:1}

  .vs-ctrl{margin-bottom:2px}
  .vs-v{display:flex; gap:4px; align-items:baseline; flex-wrap:wrap; position:relative}
  .vs-v button{font-size:16px; color:var(--ink2); padding:9px 10px; min-height:44px}
  .vs-v button:hover{color:var(--ink)}
  .vs-v button[data-on="true"]{color:var(--ink)}
  .vs-v .vs-devface{font-family:var(--dev)}
  .vs-select{font:inherit; font-size:16px; color:var(--ink2); background:none;
    border:0; border-bottom:1px solid var(--rule); padding:10px 2px; max-width:220px}

  /* the travelling underline: one mark per row, it moves rather than teleports */
  .vs-navrow::after, .vs-v::after{
    content:""; position:absolute; left:0; top:0; width:1px; height:2px;
    background:var(--saffron-full); opacity:var(--o,0);
    transform:translate(var(--x,0), var(--y,0)) scaleX(var(--w,0));
    transform-origin:0 0; transition:transform 420ms var(--ease);
    pointer-events:none}
  .vs-navrow[data-jump]::after, .vs-v[data-jump]::after{transition:none}

  .vs-gloss{margin-top:18px; padding-top:14px; border-top:1px solid var(--rule-soft)}
  .vs-ref{font-size:15px; color:var(--ink2); margin-bottom:8px}
  .vs-en{font-size:17px; line-height:1.62}
  .vs-none{font-size:15px; line-height:1.6; color:var(--ink2); font-style:italic}

  .vs-model{margin-top:20px; font-size:13px; font-style:italic; color:var(--ink2);
    line-height:1.65}
  .vs-crest{margin:22px auto 4px; display:block; width:72px; height:72px}

  /* ── reduced motion: honoured completely ─────────────────────────────── */
  @media (prefers-reduced-motion:reduce){
    .vs-af,.vs-ab,.vs-gin{animation:none}
    .vs-well,.vs-draw{animation:none !important}
    .vs-draw{opacity:1; stroke-dashoffset:37}
    .vs-wellbtn{transition:transform 90ms linear, box-shadow 90ms linear}
    .vs-sheet{transition:transform 200ms linear, background .5s ease}
    .vs-say{transition:opacity 200ms linear}
    .vs-navrow::after,.vs-v::after{transition:opacity 200ms linear}
  }

  @media (max-width:374px){
    .vs-unit[data-size="s1"] .vs-leadtext[lang="sa"]{font-size:calc(34px * var(--scale))}
    .vs-unit[data-size="s2"] .vs-leadtext[lang="sa"]{font-size:calc(25px * var(--scale))}
    .vs-center{padding:6px 14px}
    .vs-ghost{padding:8px 18px}
  }
</style>
</head>
<body>
<div class="vs-stage" id="stage" data-light="dawn" data-lead="dev">

  <header class="vs-head">
    <span class="vs-workname">Śrī Rudram</span>
    <span class="vs-where" id="where">Namakam · Anuvaka I</span>
  </header>

  <main class="vs-reading" id="reading" aria-label="The verse being chanted">
    <div class="vs-drift" id="drift">
      <button type="button" class="vs-ghost vs-ghost-prev" id="ghostPrev"
        aria-label="Step back one verse"></button>
      <section class="vs-center" id="center">
        <div class="vs-centerinner" id="centerInner"></div>
      </section>
      <button type="button" class="vs-ghost vs-ghost-next" id="ghostNext"
        aria-label="Step forward one verse"></button>
    </div>
  </main>

  <div class="vs-scrim" id="scrim"></div>

  <aside class="vs-sheet" id="sheet" aria-label="Controls">
    <div class="vs-grip" id="grip" role="button" tabindex="0"
      aria-label="Expand or collapse the sheet"><i></i></div>

    <div class="vs-bar" id="bar">
      <div class="vs-press">
        <button type="button" class="vs-wellbtn" id="well" data-condition="idle"
          aria-pressed="false" aria-label="Begin listening">
          <svg viewBox="0 0 56 56" class="vs-well" aria-hidden="true">
            <defs><clipPath id="vs-bowl"><circle cx="28" cy="28" r="23"/></clipPath></defs>
            <g clip-path="url(#vs-bowl)">
              <rect class="vs-ink" id="wellInk" x="0" y="0" width="56" height="56"/>
              <circle class="vs-drop" cx="28" cy="28" r="9"/>
            </g>
            <circle class="vs-rim" cx="28" cy="28" r="23"/>
            <circle class="vs-draw" cx="28" cy="28" r="23"/>
          </svg>
        </button>
        <span class="vs-pressword"><span class="vs-says">
          <span class="vs-say" id="pwBegin" data-on="true">Press to begin</span>
          <span class="vs-say" id="pwPause">Press to pause</span>
        </span></span>
      </div>
      <div class="vs-txt">
        <div class="vs-says" id="stateWords"></div>
        <p class="vs-sr" role="status" id="stateSr"></p>
      </div>
    </div>

    <div class="vs-more" id="more">
      <h2>Sections</h2>
      <div id="navRows"></div>

      <h2>Script leads</h2>
      <div class="vs-ctrl"><div class="vs-v" id="rowLead">
        <button type="button" class="vs-devface" data-pick="dev" lang="sa">देवनागरी</button>
        <button type="button" data-pick="ia">IAST</button>
      </div></div>

      <h2>Text size</h2>
      <div class="vs-ctrl"><div class="vs-v" id="rowSize">
        <button type="button" data-pick="0">Small</button>
        <button type="button" data-pick="1">Medium</button>
        <button type="button" data-pick="2">Large</button>
      </div></div>

      <h2>Appearance</h2>
      <div class="vs-ctrl"><div class="vs-v" id="rowLight">
        <button type="button" data-pick="lamp">Light mode</button>
        <button type="button" data-pick="dawn">Dark mode</button>
      </div></div>

{"sequence":32,"verse":17,"devanagari":"अथो॒ य इ॑षु॒धिस्तवा॒रे अ॒स्मन्निधे॑हि॒ तम्","transliteration":"atho ya iṣudhistavāre asmannidhehi tam"},
{"sequence":33,"verse":18,"devanagari":"नम॑स्ते अस्तु भगवन्विश्वेश्व॒राय॑ महादे॒वाय॑ त्र्यम्ब॒काय॑ त्रिपुरान्त॒काय॑ त्रिकाग्निका॒लाय॑ कालाग्निरु॒द्राय॑ नीलक॒ण्ठाय॑ मृत्युञ्ज॒याय॑ सर्वेश्व॒राय॑ सदाशि॒वाय॑ श्रीमन्महादे॒वाय॒ नमः॑","transliteration":"namaste astu bhagavanviśveśvarāya mahādevāya tryambakāya tripurāntakāya trikāgnikālāya kālāgnirudrāya nīlakaṇṭhāya mṛtyuñjayāya sarveśvarāya sadāśivāya śrīmanmahādevāya namaḥ"}
];

const ROMAN = ["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI",
  "XII","XIII","XIV","XV","XVI","XVII","XVIII"];
const MEANING_LINE1 = "Prostrations to Lord Rudra, who is the destroyer of sin and sorrow.";
const NONE_NOTE = "No translation is loaded. A translation is an interpretation rather than a transcription — it needs a named edition rather than being filled in from memory.";

/* verse-units: lines grouped by printed verse, as the app groups them */
const UNITS = [];
{ let last = null;
  LINES.forEach((line, i) => {
    if (last && last.verse === line.verse) last.indices.push(i);
    else { last = { verse: line.verse, indices: [i] }; UNITS.push(last); }
  });
}
const UNIT_OF = []; UNITS.forEach((u, k) => u.indices.forEach(i => UNIT_OF[i] = k));

/* the full 24-section list — only Anuvaka I's text is in this demo */
const SECTIONS = [];
for (let i = 1; i <= 11; i++) SECTIONS.push({work:"Namakam", label:ROMAN[i], title:"Namakam · Anuvaka " + ROMAN[i], has:i === 1});
SECTIONS.push({work:"Rudra mantras", label:"Rudra", title:"Rudra mantras", has:false});
for (let i = 1; i <= 11; i++) SECTIONS.push({work:"Chamakam", label:ROMAN[i], title:"Chamakam · Anuvaka " + ROMAN[i], has:false});
SECTIONS.push({work:"Śānti", label:"Śānti", title:"Śānti mantras", has:false});

const STATE_WORDS = {
  following:{word:"Following.", sub:"Your voice is being tracked line by line."},
  holding:{word:"Holding your place.", sub:"Still on the last line it was sure of."},
  locating:{word:"Finding your place…", sub:"It can hear you, but has not found the line yet."},
  starting:{word:"Starting…", sub:"Opening the microphone and waking the model."},
  idle:{word:"Not listening.", sub:"The microphone is off. Nothing is being heard."},
};

const SIZES = [0.86, 1, 1.18];
const el = (id) => document.getElementById(id);
const stage = el("stage");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ═══ state ═══ */
const S = {
  line: 0,            // active line index into LINES
  leaf: null,         // a SECTIONS entry when parked on a section leaf
  leafBack: null,     // the unit a session-boundary leaf can step back to
  lead: "dev",
  light: "dawn",
  size: 1,
  cond: "idle",       // idle | starting | locating | following | holding
  p: 0, reached: 0, total: 0, durMs: 5000,
  timers: [],
};

/* ═══ text helpers ═══ */
const wordsOf = (t) => t.split(/\s+/).filter(Boolean);
const durFor = (i) => Math.min(10000, Math.max(4000, wordsOf(LINES[i].devanagari).length * 720));
function sizeClass(unit) {
  const n = unit.indices.map(i => LINES[i].devanagari).join("").replace(/\s/g, "").length;
  return n < 26 ? "s1" : n > 120 ? "s3" : "s2";
}
function spanify(text, reached, total, lead) {
  let spoken = -1, out = "";
  for (const part of text.split(/(\s+)/)) {
    if (/^\s*$/.test(part)) { out += part; continue; }
    spoken++;
    if (spoken < reached) out += '<span class="vs-inked">' + part + "</span>";
    else if (lead && spoken === reached)
      out += '<span class="vs-nowword" style="--wp:calc((var(--glide,0) * ' +
        total + " - " + reached + ') * 100%)">' + part + "</span>";
    else out += "<span>" + part + "</span>";
  }
  return out;
}

/* ═══ the centre and its ghosts ═══ */
function leadText(line){ return S.lead === "dev" ? line.devanagari : line.transliteration; }
function secText(line){ return S.lead === "dev" ? line.transliteration : line.devanagari; }
const leadLang = () => S.lead === "dev" ? "sa" : "sa-Latn";
const secLang  = () => S.lead === "dev" ? "sa-Latn" : "sa";

function unitMarkup(unitIdx) {
  const unit = UNITS[unitIdx];
  const a = LINES[unit.indices[0]].sequence, b = LINES[unit.indices[unit.indices.length-1]].sequence;
  const eyebrow = "Verse " + (ROMAN[unit.verse] || unit.verse) + " · " +
    (a === b ? "Line " + a : "Lines " + a + "–" + b);
  let html = '<div class="vs-eyebrow">' + eyebrow + '</div>' +
    '<div class="vs-unit" data-size="' + sizeClass(unit) + '" style="--scale:' + SIZES[S.size] + '">';
  for (const i of unit.indices) {
    const line = LINES[i], current = i === S.line;
    const lw = wordsOf(leadText(line)), sw = wordsOf(secText(line));
    const total = lw.length;
    const reach = current ? Math.max(0, Math.min(total - 1, S.reached)) : 0;
    const secReach = current && total ? Math.floor(reach * sw.length / total) : 0;
    html += '<div class="vs-ln" data-i="' + i + '">' +
      '<div class="vs-leadtext" lang="' + leadLang() + '">' +
        (current ? spanify(leadText(line), reach, total, true) : leadText(line)) + "</div>" +
      '<div class="vs-second" lang="' + secLang() + '">' +
        (current ? spanify(secText(line), secReach, sw.length, false) : secText(line)) + "</div>" +
      (current ? '<div class="vs-prog"><i></i></div>' : "") +
      "</div>";
  }
  return html + "</div>";
}
function leafMarkup(section, fromSession) {
  const lone = section.title === section.work || section.label === section.work ||
    !/^[IVX]+$/.test(section.label);
  return '<div class="vs-leaf">' +
    '<div class="vs-leafrule"></div>' +
    (lone ? '<div class="vs-leafwork">&nbsp;</div><div class="vs-leafname">' + section.title + "</div>"
          : '<div class="vs-leafwork">' + section.work + "</div>" +
            '<div class="vs-leafname">Anuvaka ' + section.label + "</div>") +
    '<div class="vs-leafrule"></div>' +
    '<div class="vs-leafnote">' +
      (fromSession ? "Anuvaka I is complete. " : "") +
      "This demo carries Anuvaka 1's text only — in the app, the section continues here.</div>" +
    "</div>";
}
function ghostMarkup(unitIdx) {
  if (unitIdx === null || unitIdx < 0 || unitIdx >= UNITS.length) return "";
  return UNITS[unitIdx].indices.map(i =>
    '<span class="vs-gtext" lang="' + leadLang() + '">' + leadText(LINES[i]) + "</span>"
  ).join("");
}

let shownUnit = null;   // unit index currently in the centre, or "leaf"
function paintCenter(dir) {
  const inner = el("centerInner");
  const target = S.leaf ? "leaf" : UNIT_OF[S.line];
  const moved = target !== shownUnit;
  shownUnit = target;

  if (moved && dir && !reduced) {
    // the finished breath recedes and pales; WAAPI so the DOM can be replaced
    const clone = inner.cloneNode(true);
    clone.style.cssText = "position:absolute;left:20px;right:20px;top:" +
      inner.offsetTop + "px;pointer-events:none";
    el("center").appendChild(clone);
    clone.animate(
      [{opacity:1, transform:"translateY(0)"},
       {opacity:0, transform:"translateY(" + (dir > 0 ? -28 : 28) + "px)"}],
      {duration:460, easing:"cubic-bezier(.16,1,.3,1)"}
    ).onfinish = () => clone.remove();
  }

  inner.innerHTML = S.leaf ? leafMarkup(S.leaf, S.leaf._fromSession) : unitMarkup(UNIT_OF[S.line]);
  if (moved && dir) {
    inner.classList.remove("vs-af", "vs-ab"); void inner.offsetWidth;
    inner.classList.add(dir > 0 ? "vs-af" : "vs-ab");
  }

  const u = UNIT_OF[S.line];
  const prev = S.leaf ? S.leafBack : (u > 0 ? u - 1 : null);
  const next = S.leaf ? null : (u < UNITS.length - 1 ? u + 1 : null);
  const gp = el("ghostPrev"), gn = el("ghostNext");
  gp.innerHTML = ghostMarkup(prev);
  gn.innerHTML = ghostMarkup(next);
  if (moved && dir) {
    for (const g of [gp, gn]) { g.classList.remove("vs-gin"); void g.offsetWidth; g.classList.add("vs-gin"); }
  }
  gp.style.visibility = gp.innerHTML ? "visible" : "hidden";
  gn.style.visibility = gn.innerHTML ? "visible" : "hidden";

  el("where").textContent = S.leaf ? S.leaf.title : "Namakam · Anuvaka I";
  paintGloss();
}
function paintInk() {
  // repaint only the current line's two scripts — a handful of spans
  const node = el("centerInner").querySelector('.vs-ln[data-i="' + S.line + '"]');
  if (!node) return;
  const line = LINES[S.line];
  const lw = wordsOf(leadText(line)), sw = wordsOf(secText(line));
  const reach = Math.max(0, Math.min(lw.length - 1, S.reached));
  const secReach = lw.length ? Math.floor(reach * sw.length / lw.length) : 0;
  node.querySelector(".vs-leadtext").innerHTML = spanify(leadText(line), reach, lw.length, true);
  node.querySelector(".vs-second").innerHTML = spanify(secText(line), secReach, sw.length, false);
}
function paintGloss() {
  const ref = el("glossRef"), body = el("glossBody");
  if (S.leaf) {
    ref.textContent = S.leaf.title;
    body.innerHTML = '<div class="vs-none">' + NONE_NOTE + "</div>";
    return;
  }
  const unit = UNITS[UNIT_OF[S.line]];
  const a = LINES[unit.indices[0]].sequence, b = LINES[unit.indices[unit.indices.length-1]].sequence;
  ref.textContent = "Namakam · Anuvaka I · Verse " + (ROMAN[unit.verse] || unit.verse) +
    " · " + (a === b ? "Line " + a : "Lines " + a + "–" + b);
  body.innerHTML = unit.verse === 1
    ? '<div class="vs-en">“' + MEANING_LINE1 + '”</div>'
    : '<div class="vs-none">' + NONE_NOTE + "</div>";
}

/* ═══ position changes ═══ */
function beginLine(i) {
  S.line = i; S.p = 0; S.reached = 0;
  S.total = wordsOf(leadText(LINES[i])).length;
  S.durMs = durFor(i);
  stage.style.setProperty("--glide", "0");
}
function setLine(i, dir) {
  const wasLeaf = !!S.leaf;
  S.leaf = null;
  const from = wasLeaf ? "leaf" : UNIT_OF[S.line];
  beginLine(i);
  const to = UNIT_OF[i];
  paintCenter(from === to ? 0 : (dir !== undefined ? dir : (wasLeaf ? -1 : (to > from ? 1 : -1))));
  if (from === to) paintInk();
  lastT = 0;
}
function goLeaf(section, dir, fromSession) {
  // the ghost above a leaf is memory: it exists only when a breath led here
  S.leafBack = fromSession ? UNITS.length - 1 : null;
  S.leaf = section; S.leaf._fromSession = !!fromSession;
  stage.style.setProperty("--glide", "0");
  paintCenter(dir || 1);
  if (S.cond === "following" || S.cond === "locating") setCond("holding");
}

/* ═══ the simulated session ═══ */
let raf = 0, lastT = 0;
function loop(t) {
  raf = requestAnimationFrame(loop);
  driveWellInk(t);
  if (S.cond !== "following" || S.leaf) { lastT = t; return; }
  const dt = lastT ? Math.min(90, t - lastT) : 0;
  lastT = t;
  S.p += dt / S.durMs;
  if (S.p >= 1) {
    if (S.line < LINES.length - 1) {
      const from = UNIT_OF[S.line];
      beginLine(S.line + 1);
      const to = UNIT_OF[S.line];
      if (to !== from) paintCenter(1); else { paintCenter(0); }
      paintInk();
    } else {
      // the section boundary, arriving as a replacement
      goLeaf(SECTIONS[1], 1, true);
    }
    return;
  }
  stage.style.setProperty("--glide", S.p.toFixed(4));
  const reach = Math.floor(S.p * S.total);
  if (reach !== S.reached) { S.reached = reach; paintInk(); }
}
function driveWellInk(t) {
  const node = el("wellInk");
  if (S.cond !== "following" && S.cond !== "holding") { node.style.setProperty("--ink", "0"); return; }
  const FLOOR = 0.3;
  const lvl = S.cond === "holding" ? 0.08 :
    Math.max(0, Math.min(1, 0.42 + 0.26*Math.sin(t/640) + 0.18*Math.sin(t/233 + 1.7) + 0.1*Math.sin(t/97)));
  node.style.setProperty("--ink", (FLOOR + lvl * (1 - FLOOR)).toFixed(3));
}
raf = requestAnimationFrame(loop);

/* ═══ condition & words ═══ */
function setCond(c) {
  S.cond = c;
  el("well").dataset.condition = c === "starting" ? "locating" : c;
  const live = c !== "idle";
  el("well").dataset.live = live;
  el("well").dataset.busy = c === "starting";
  el("well").disabled = c === "starting";
  el("well").setAttribute("aria-pressed", live);
  el("well").setAttribute("aria-label", live ? "Pause listening" : "Begin listening");
  el("pwBegin").dataset.on = !live;
  el("pwPause").dataset.on = live;
  for (const say of el("stateWords").children)
    say.dataset.on = say.dataset.key === c;
  el("stateSr").textContent = STATE_WORDS[c].word + " " + STATE_WORDS[c].sub;
}
{ // build the stacked state words once
  const box = el("stateWords");
  for (const key of ["idle","starting","locating","following","holding"]) {
    const d = document.createElement("div");
    d.className = "vs-say"; d.dataset.key = key;
    d.innerHTML = '<div class="vs-word">' + STATE_WORDS[key].word +
      '</div><div class="vs-sub">' + STATE_WORDS[key].sub + "</div>";
    box.appendChild(d);
  }
}
el("well").addEventListener("click", () => {
  if (S.cond === "idle") {
    setCond("starting");
    S.timers.push(setTimeout(() => setCond("locating"), 1300));
    S.timers.push(setTimeout(() => {
      if (S.leaf) { S.leaf = null; setLine(0, -1); }
      setCond("following"); lastT = 0;
    }, 2700));
  } else {
    S.timers.forEach(clearTimeout); S.timers = [];
    setCond("idle");
  }
});

/* ═══ correcting by touch ═══ */
function stepUnit(delta) {
  if (S.leaf) {
    if (delta < 0 && S.leafBack !== null) setLine(UNITS[S.leafBack].indices[0], -1);
    return;
  }
  const u = UNIT_OF[S.line] + delta;
  if (u < 0) return;
  if (u >= UNITS.length) { goLeaf(SECTIONS[1], 1, false); return; }
  setLine(UNITS[u].indices[0], delta);
}
el("ghostPrev").addEventListener("click", () => { if (!swiped) stepUnit(-1); });
el("ghostNext").addEventListener("click", () => { if (!swiped) stepUnit(1); });
el("centerInner").addEventListener("click", (e) => {
  if (swiped) return;
  const ln = e.target.closest(".vs-ln");
  if (ln) { const i = +ln.dataset.i; if (i !== S.line) setLine(i); }
});

/* a swipe is one breath; flicks chain. The paper resists a little, then turns. */
let swiped = false;
{ const reading = el("reading"), drift = el("drift");
  let y0 = null, dy = 0;
  reading.addEventListener("pointerdown", (e) => { y0 = e.clientY; dy = 0; swiped = false; });
  reading.addEventListener("pointermove", (e) => {
    if (y0 === null) return;
    dy = e.clientY - y0;
    if (Math.abs(dy) > 10) swiped = true;
    if (swiped) { drift.style.transition = "none";
      drift.style.transform = "translateY(" + (dy * 0.22) + "px)"; }
  });
  const settle = () => {
    drift.style.transition = "transform 480ms cubic-bezier(.16,1,.3,1)";
    drift.style.transform = "translateY(0)";
  };
  reading.addEventListener("pointerup", () => {
    if (y0 === null) return;
    if (swiped) { settle(); if (dy < -48) stepUnit(1); else if (dy > 48) stepUnit(-1); }
    y0 = null; setTimeout(() => { swiped = false; }, 0);
  });
  reading.addEventListener("pointercancel", () => { y0 = null; settle(); });
  reading.addEventListener("wheel", (e) => {   /* desktop courtesy while judging */
    if (Math.abs(e.deltaY) > 24) { stepUnit(e.deltaY > 0 ? 1 : -1); e.preventDefault(); }
  }, {passive:false});
}
addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowRight") stepUnit(1);
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") stepUnit(-1);
  if (e.key === "Escape") setSheet(false);
});

/* ═══ the sheet ═══ */
const sheet = el("sheet"), grip = el("grip"), scrim = el("scrim");
let expanded = false, collapsedY = 0;
function measureSheet() {
  const barH = grip.offsetHeight + el("bar").offsetHeight;
  collapsedY = sheet.offsetHeight - barH;
  document.documentElement.style.setProperty("--barh",
    (barH + (sheet.getBoundingClientRect().bottom > innerHeight - 2 ? 0 : 0)) + "px");
  stage.style.setProperty("--barh", barH + "px");
  applySheet();
}
function applySheet() {
  sheet.style.transform = "translateY(" + (expanded ? 0 : collapsedY) + "px)";
  scrim.dataset.on = expanded;
  grip.setAttribute("aria-expanded", expanded);
}
function setSheet(open) { expanded = open; sheet.dataset.drag = "false"; applySheet(); }
scrim.addEventListener("click", () => setSheet(false));
grip.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSheet(!expanded); }
});
{ let y0 = null, base = 0, moved = false, lastY = 0, lastAt = 0, vel = 0;
  const down = (e) => { y0 = e.clientY; base = expanded ? 0 : collapsedY; moved = false;
    lastY = e.clientY; lastAt = performance.now(); vel = 0;
    grip.setPointerCapture && grip.setPointerCapture(e.pointerId); };
  const move = (e) => {
    if (y0 === null) return;
    const dy = e.clientY - y0;
    if (Math.abs(dy) > 6) moved = true;
    const now = performance.now();
    if (now - lastAt > 0) vel = (e.clientY - lastY) / (now - lastAt);
    lastY = e.clientY; lastAt = now;
    if (moved) { sheet.dataset.drag = "true";
      const y = Math.max(0, Math.min(collapsedY, base + dy));
      sheet.style.transform = "translateY(" + y + "px)"; }
  };
  const up = () => {
    if (y0 === null) return;
    if (!moved) { setSheet(!expanded); }
    else {
      const y = new DOMMatrixReadOnly(getComputedStyle(sheet).transform).m42;
      expanded = Math.abs(vel) > 0.35 ? vel < 0 : y < collapsedY / 2;
      sheet.dataset.drag = "false"; applySheet();
    }
    y0 = null;
  };
  grip.addEventListener("pointerdown", down);
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", up);
  grip.addEventListener("pointercancel", up);
}
addEventListener("resize", measureSheet);

/* ═══ the sheet's contents ═══ */
function slide(row) {
  const on = row.querySelector('[data-on="true"], .vs-here');
  if (!on) { row.style.setProperty("--o", "0"); return; }
  row.style.setProperty("--o", "1");
  row.style.setProperty("--x", on.offsetLeft + "px");
  row.style.setProperty("--y", (on.offsetTop + on.offsetHeight - 6) + "px");
  row.style.setProperty("--w", String(on.offsetWidth));
}
function placeAll() { document.querySelectorAll(".vs-navrow, .vs-v").forEach(slide); }

{ // section navigation, the full 24
  const box = el("navRows");
  const perWork = {};
  SECTIONS.forEach(s => perWork[s.work] = (perWork[s.work] || 0) + 1);
  let row = null, lastWork = null;
  SECTIONS.forEach((s, k) => {
    const lone = perWork[s.work] === 1;
    if (s.work !== lastWork) {
      lastWork = s.work;
      row = document.createElement("div"); row.className = "vs-navrow";
      if (!lone) { // a work of one section is named by its own button
        const lbl = document.createElement("span"); lbl.className = "vs-lbl";
        lbl.textContent = s.work; row.appendChild(lbl);
      }
      box.appendChild(row);
    }
    const b = document.createElement("button"); b.type = "button";
    b.textContent = lone ? s.title : s.label; b.title = s.title; b.dataset.k = k;
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach(x => { x.classList.remove("vs-here"); x.dataset.on = "false"; });
      b.classList.add("vs-here"); b.dataset.on = "true";
      if (s.has) setLine(0, -1); else goLeaf(s, 1, false);
      setSheet(false); requestAnimationFrame(placeAll);
    });
    if (k === 0) { b.classList.add("vs-here"); b.dataset.on = "true"; }
    row.appendChild(b);
  });
}
function wireRow(id, get, set) {
  const row = el(id);
  const paint = () => {
    row.querySelectorAll("button").forEach(b => b.dataset.on = String(b.dataset.pick === String(get())));
    slide(row);
  };
  row.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { set(b.dataset.pick); paint(); }));
  paint();
}
wireRow("rowLead", () => S.lead, (v) => {
  S.lead = v; stage.dataset.lead = v; shownUnit = null; paintCenter(0); paintInk();
});
wireRow("rowSize", () => S.size, (v) => { S.size = +v; paintCenter(0); paintInk(); });
wireRow("rowLight", () => S.light, (v) => { S.light = v; stage.dataset.light = v; });

/* microphone labels, if the browser will share them — never a request to record */
if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
  navigator.mediaDevices.enumerateDevices().then(list => {
    for (const d of list) {
      if (d.kind !== "audioinput" || !d.label) continue;
      const o = document.createElement("option");
      o.value = d.deviceId; o.textContent = d.label;
      el("micPick").appendChild(o);
    }
  }).catch(() => {});
}

/* ═══ first paint ═══ */
beginLine(0);
setCond("idle");
paintCenter(0); paintInk();
measureSheet();
requestAnimationFrame(() => { measureSheet(); placeAll(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeAll);
</script>
</body>
</html>
